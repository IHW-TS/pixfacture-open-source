services:
  backend:
    build:
      context: ./backend
      target: app
      args:
        INSTALL_VERAPDF: ${INSTALL_VERAPDF:-true}
    env_file: ${ENV_FILE:-.env}
    environment:
      RUN_MIGRATIONS_ON_STARTUP: "true"
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]

  frontend:
    build:
      context: ./frontend
      args:
        APP_ENV: ${APP_ENV}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
        NEXT_PUBLIC_ENABLE_EINVOICING_PAGES: ${NEXT_PUBLIC_ENABLE_EINVOICING_PAGES}
        NEXT_PUBLIC_ENABLE_PDP_INTEGRATION: ${NEXT_PUBLIC_ENABLE_PDP_INTEGRATION}
        NEXT_PUBLIC_ENABLE_PPF_DIRECTORY: ${NEXT_PUBLIC_ENABLE_PPF_DIRECTORY}
        NEXT_PUBLIC_MVP_COMMERCIAL_MODE: ${NEXT_PUBLIC_MVP_COMMERCIAL_MODE}
        NEXT_PUBLIC_COMPLIANCE_CLAIM_LEVEL: ${NEXT_PUBLIC_COMPLIANCE_CLAIM_LEVEL}
        NEXT_PUBLIC_SHOW_DEV_CONNECTORS: ${NEXT_PUBLIC_SHOW_DEV_CONNECTORS}
        NEXT_PUBLIC_HIDE_DEV_PAGES: ${NEXT_PUBLIC_HIDE_DEV_PAGES}
        NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${NEXT_PUBLIC_LEGAL_COMPANY_NAME}
        NEXT_PUBLIC_LEGAL_COMPANY_LEGAL_FORM: ${NEXT_PUBLIC_LEGAL_COMPANY_LEGAL_FORM}
        NEXT_PUBLIC_LEGAL_COMPANY_CAPITAL: ${NEXT_PUBLIC_LEGAL_COMPANY_CAPITAL}
        NEXT_PUBLIC_LEGAL_COMPANY_RCS_CITY: ${NEXT_PUBLIC_LEGAL_COMPANY_RCS_CITY}
        NEXT_PUBLIC_LEGAL_COMPANY_RCS_NUMBER: ${NEXT_PUBLIC_LEGAL_COMPANY_RCS_NUMBER}
        NEXT_PUBLIC_LEGAL_COMPANY_VAT_NUMBER: ${NEXT_PUBLIC_LEGAL_COMPANY_VAT_NUMBER}
        NEXT_PUBLIC_LEGAL_COMPANY_SIRET: ${NEXT_PUBLIC_LEGAL_COMPANY_SIRET}
        NEXT_PUBLIC_LEGAL_COMPANY_ADDRESS: ${NEXT_PUBLIC_LEGAL_COMPANY_ADDRESS}
        NEXT_PUBLIC_LEGAL_COMPANY_EMAIL: ${NEXT_PUBLIC_LEGAL_COMPANY_EMAIL}
        NEXT_PUBLIC_LEGAL_COMPANY_PHONE: ${NEXT_PUBLIC_LEGAL_COMPANY_PHONE}
        NEXT_PUBLIC_LEGAL_PUBLISHER_DIRECTOR: ${NEXT_PUBLIC_LEGAL_PUBLISHER_DIRECTOR}
        NEXT_PUBLIC_LEGAL_HOSTING_PROVIDER_NAME: ${NEXT_PUBLIC_LEGAL_HOSTING_PROVIDER_NAME}
        NEXT_PUBLIC_LEGAL_HOSTING_PROVIDER_ADDRESS: ${NEXT_PUBLIC_LEGAL_HOSTING_PROVIDER_ADDRESS}
        NEXT_PUBLIC_LEGAL_HOSTING_PHONE: ${NEXT_PUBLIC_LEGAL_HOSTING_PHONE}
        NEXT_PUBLIC_LEGAL_PRIVACY_CONTACT_EMAIL: ${NEXT_PUBLIC_LEGAL_PRIVACY_CONTACT_EMAIL}
        NEXT_PUBLIC_LEGAL_DPO_EMAIL: ${NEXT_PUBLIC_LEGAL_DPO_EMAIL}
        NEXT_PUBLIC_LEGAL_DPO_DESIGNATED: ${NEXT_PUBLIC_LEGAL_DPO_DESIGNATED:-false}
        NEXT_PUBLIC_LEGAL_SUPPORT_EMAIL: ${NEXT_PUBLIC_LEGAL_SUPPORT_EMAIL}
        NEXT_PUBLIC_LEGAL_LAST_UPDATED: ${NEXT_PUBLIC_LEGAL_LAST_UPDATED}
        NEXT_PUBLIC_LEGAL_DOC_VERSION_TERMS: ${NEXT_PUBLIC_LEGAL_DOC_VERSION_TERMS}
        NEXT_PUBLIC_LEGAL_DOC_VERSION_CGV: ${NEXT_PUBLIC_LEGAL_DOC_VERSION_CGV:-${NEXT_PUBLIC_LEGAL_DOC_VERSION_TERMS}}
        NEXT_PUBLIC_LEGAL_DOC_VERSION_DPA: ${NEXT_PUBLIC_LEGAL_DOC_VERSION_DPA}
        NEXT_PUBLIC_LEGAL_DOC_VERSION_PRIVACY: ${NEXT_PUBLIC_LEGAL_DOC_VERSION_PRIVACY}
        NEXT_PUBLIC_LEGAL_DOC_VERSION_COOKIES: ${NEXT_PUBLIC_LEGAL_DOC_VERSION_COOKIES}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS}
        NEXT_PUBLIC_LEGAL_EMAIL: ${NEXT_PUBLIC_LEGAL_EMAIL}
        NEXT_PUBLIC_DPO_EMAIL: ${NEXT_PUBLIC_DPO_EMAIL}
        NEXT_PUBLIC_CONTACT_PHONE: ${NEXT_PUBLIC_CONTACT_PHONE}
        NEXT_PUBLIC_LEGAL_RCS: ${NEXT_PUBLIC_LEGAL_RCS}
        NEXT_PUBLIC_LEGAL_SIRET: ${NEXT_PUBLIC_LEGAL_SIRET}
        NEXT_PUBLIC_LEGAL_VAT_NUMBER: ${NEXT_PUBLIC_LEGAL_VAT_NUMBER}
        NEXT_PUBLIC_LEGAL_DIRECTOR_PUBLICATION: ${NEXT_PUBLIC_LEGAL_DIRECTOR_PUBLICATION}
        NEXT_PUBLIC_LEGAL_JURISDICTION: ${NEXT_PUBLIC_LEGAL_JURISDICTION}
        NEXT_PUBLIC_LEGAL_HOSTING_PROVIDER: ${NEXT_PUBLIC_LEGAL_HOSTING_PROVIDER}
        NEXT_PUBLIC_LEGAL_HOSTING_LOCATION: ${NEXT_PUBLIC_LEGAL_HOSTING_LOCATION}
        NEXT_PUBLIC_LEGAL_HOSTING_WEBSITE: ${NEXT_PUBLIC_LEGAL_HOSTING_WEBSITE}
        NEXT_PUBLIC_LEGAL_EMAIL_PROVIDER: ${NEXT_PUBLIC_LEGAL_EMAIL_PROVIDER}
        NEXT_PUBLIC_LEGAL_EMAIL_LOCATION: ${NEXT_PUBLIC_LEGAL_EMAIL_LOCATION}
        NEXT_PUBLIC_LEGAL_PAYMENT_PROVIDER: ${NEXT_PUBLIC_LEGAL_PAYMENT_PROVIDER}
        NEXT_PUBLIC_LEGAL_PAYMENT_LOCATION: ${NEXT_PUBLIC_LEGAL_PAYMENT_LOCATION}
        NEXT_PUBLIC_LEGAL_MONITORING_PROVIDER: ${NEXT_PUBLIC_LEGAL_MONITORING_PROVIDER}
        NEXT_PUBLIC_LEGAL_MONITORING_LOCATION: ${NEXT_PUBLIC_LEGAL_MONITORING_LOCATION}
        NEXT_PUBLIC_LEGAL_PDP_PROVIDER: ${NEXT_PUBLIC_LEGAL_PDP_PROVIDER}
        NEXT_PUBLIC_LEGAL_PDP_LOCATION: ${NEXT_PUBLIC_LEGAL_PDP_LOCATION}
        NEXT_PUBLIC_LEGAL_PDF_CGV_URL: ${NEXT_PUBLIC_LEGAL_PDF_CGV_URL}
        NEXT_PUBLIC_LEGAL_PDF_CGU_URL: ${NEXT_PUBLIC_LEGAL_PDF_CGU_URL}
        NEXT_PUBLIC_LEGAL_PDF_DPA_URL: ${NEXT_PUBLIC_LEGAL_PDF_DPA_URL}
        NEXT_PUBLIC_LEGAL_SUBPROCESSORS: ${NEXT_PUBLIC_LEGAL_SUBPROCESSORS}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN}
        NEXT_PUBLIC_SOURCE_CODE_URL: ${NEXT_PUBLIC_SOURCE_CODE_URL}
        NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        API_ORIGIN: ${API_ORIGIN}
        NEXT_PUBLIC_FACTURX_SPEC_VERSION: ${NEXT_PUBLIC_FACTURX_SPEC_VERSION}
        NEXT_PUBLIC_OFFICIAL_SOURCES_LAST_UPDATED: ${NEXT_PUBLIC_OFFICIAL_SOURCES_LAST_UPDATED}
        NEXT_PUBLIC_TRUST_CENTER_LAST_UPDATED: ${NEXT_PUBLIC_TRUST_CENTER_LAST_UPDATED}
        FRONTEND_PUBLIC_CONFIG_SHA256: ${FRONTEND_PUBLIC_CONFIG_SHA256:-}
    env_file: ${FRONTEND_ENV_FILE:-/opt/facturation/env/frontend.prod.env}
    expose:
      - "3000"
    depends_on: [ backend ]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sass_facturation
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
