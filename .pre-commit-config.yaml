repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --redact --staged
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--config, backend/pyproject.toml]
        files: ^backend/app/(compliance/.*\.py|services/cii\.py)$
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--config, backend/pyproject.toml]
        files: ^backend/app/(compliance/.*\.py|services/cii\.py)$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--config-file, backend/pyproject.toml, --follow-imports=skip]
        additional_dependencies: ["SQLAlchemy==2.0.35"]
        files: ^backend/app/(compliance/.*\.py|services/cii\.py)$
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-c, backend/pyproject.toml, -ll]
        files: ^backend/app/(compliance/.*\.py|services/cii\.py)$
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: npm
        language: system
        args: ["--prefix", "frontend", "run", "lint"]
        pass_filenames: false
        files: ^frontend/
      - id: prettier
        name: prettier (frontend)
        entry: npm
        language: system
        args: ["--prefix", "frontend", "run", "format:check"]
        pass_filenames: false
        files: ^frontend/
